[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stx-agent"
version = "0.1.0"
description = "A self-hosted, policy-aware AI engineering agent foundation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - ScottsTechX Enterprises (U) Ltd" }
authors = [{ name = "ScottsTechX Enterprises (U) Ltd" }]
dependencies = []

[project.scripts]
stx = "stx_agent.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stx_agent = ["dashboard/*.html", "dashboard/*.js", "dashboard/*.css"]
