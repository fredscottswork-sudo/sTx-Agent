# Copy to stx.config.toml and edit. Keep API keys in environment variables.
[agent]
autonomy = "assisted" # manual | assisted | autonomous
default_profile = "default"
max_tool_steps = 12

[providers.openai]
kind = "openai_compatible"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
timeout_seconds = 60
require_api_key = true
allow_insecure_http = false # Set true only for a trusted non-loopback endpoint.

# Optional native Anthropic Messages API provider. Add an Anthropic model profile
# below and set ANTHROPIC_API_KEY in the invoking environment.
# [providers.anthropic]
# kind = "anthropic"
# base_url = "https://api.anthropic.com/v1"
# api_key_env = "ANTHROPIC_API_KEY"
# timeout_seconds = 60
# require_api_key = true

[models.default]
provider = "openai"
model = "gpt-4o-mini" # Replace with a model supported by your endpoint.
temperature = 0.2

# Optional model profiles. The router uses these names when configured.
# [models.fast]
# provider = "openai"
# model = "gpt-4o-mini"
# [models.coding]
# provider = "openai"
# model = "YOUR_CODING_MODEL"
# [models.reasoning]
# provider = "openai"
# model = "YOUR_REASONING_MODEL"
# [models.anthropic]
# provider = "anthropic"
# model = "YOUR_ANTHROPIC_MODEL"
# temperature = 0.2 # Anthropic API accepts 0–1.

[permissions]
"filesystem.read" = "allow"
"filesystem.read_sensitive" = "deny"
"filesystem.write" = "confirm"
"terminal.execute" = "confirm"
"git.read" = "allow"
"git.modify" = "confirm"
"memory.read" = "allow"
"memory.write" = "confirm"
"network.fetch" = "confirm"
"tasks.history.delete" = "confirm"

[logging]
enabled = false
directory = ".stx/runs"

[index]
enabled = true
max_files = 10000
max_file_bytes = 512000
context_files = 6
context_chars = 18000

[memory]
enabled = true
retention_days = 180

[network]
enabled = false
allowed_hosts = [] # Exact hostnames or subdomain patterns, such as "*.docs.example.com".
timeout_seconds = 15
max_response_bytes = 300000

[tasks]
retention_days = 90
max_records = 2000
